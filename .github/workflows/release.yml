name: Release

# Runs when a version tag is pushed: the whole quality gate again, then the
# release itself. See CONTRIBUTING.md for how to cut one.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib.yml@2a1e1c4cf9d40054c784960b0f50040eb156aca6 # v0.1.2
    with:
      postgres: false
      redis: false
      kafka: false

  release:
    name: Release
    needs: verify
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib-release.yml@2a1e1c4cf9d40054c784960b0f50040eb156aca6 # v0.1.2
    permissions:
      contents: write
      id-token: write
      attestations: write
